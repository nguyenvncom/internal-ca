server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index 404.html;

    location / {
        return 404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    include /etc/nginx/snippets/security.conf;

    root /usr/share/nginx/html;
    index 404.html;

    location / {
        return 404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
