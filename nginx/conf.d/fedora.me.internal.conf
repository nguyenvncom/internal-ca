upstream fedora {
    # LAN INTERFACE
    server 192.168.0.24:9090 max_fails=1 fail_timeout=4s;

    # WIFI INTERFACE
    server 192.168.0.16:9090 backup max_fails=1 fail_timeout=4s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name fedora.me.internal;

    include /etc/nginx/snippets/security.conf;

    location / {
        proxy_pass https://fedora;

        include /etc/nginx/snippets/proxy.conf;
	
	# REQUIRED FOR COCKPIT WEBSOCKET
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";

	proxy_buffering off;
	gzip off;
	
	proxy_connect_timeout 3s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;

        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 8s;

	# USEFUL WHEN THE FEDORA SERVER USES A SELF-SIGNED CERTIFICATE.
	# PREFER CONFIGURING UPSTREAM CERTIFICATE VERIFICATION
	# WITH YOUR TRUSTED CA WHEN PRACTICAL.
	proxy_ssl_verify off;
    }
}
