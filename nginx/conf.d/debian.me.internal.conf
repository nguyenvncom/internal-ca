upstream debian {
    # WIFI INTERFACE
    server 192.168.0.8:9090 max_fails=1 fail_timeout=4s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name debian.me.internal;

    include /etc/nginx/snippets/security.conf;

    location / {
        proxy_pass https://debian;
	include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/cockpit.conf;
    }
}
