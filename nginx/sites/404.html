
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b16">
<title>404 — Page Not Found</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --bg: #070b16;
    --cyan: #00f5ff;
    --purple: #8b5cf6;
    --text: #f5f7ff;
    --muted: #8b96ad;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(0,245,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,.035) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
}

.glow {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .16;
    pointer-events: none;
}

.glow.one {
    background: var(--cyan);
    top: -200px;
    left: -100px;
}

.glow.two {
    background: var(--purple);
    right: -150px;
    bottom: -200px;
}

.container {
    position: relative;
    z-index: 1;
    width: min(720px, 92%);
    text-align: center;
    padding: 48px 20px;
    animation: appear 1s ease both;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px;
    margin-bottom: 25px;
    border: 1px solid rgba(0,245,255,.25);
    border-radius: 30px;
    background: rgba(0,245,255,.055);
    color: var(--cyan);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    animation: blink 1.5s infinite;
}

.error-code {
    position: relative;
    font-size: clamp(115px, 25vw, 230px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -14px;
    color: transparent;
    background: linear-gradient(
        135deg,
        #ffffff 5%,
        var(--cyan) 45%,
        var(--purple) 90%
    );
    background-clip: text;
    -webkit-background-clip: text;
    filter: drop-shadow(0 0 35px rgba(0,245,255,.15));
    animation: float 5s ease-in-out infinite;
}

.error-code::after {
    content: "404";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, white, transparent);
    background-clip: text;
    -webkit-background-clip: text;
    opacity: .15;
    animation: shine 4s linear infinite;
}

h1 {
    margin-top: 28px;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: -1px;
}

.description {
    max-width: 440px;
    margin: 17px auto 30px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.9;
}

.actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 13px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 48px;
    padding: 0 23px;
    border-radius: 10px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: .25s ease;
    cursor: pointer;
}

.btn-primary {
    color: #061018;
    background: var(--cyan);
    box-shadow: 0 0 25px rgba(0,245,255,.15);
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 35px rgba(0,245,255,.35);
}

.btn-secondary {
    color: #d7deed;
    border: 1px solid #252e43;
    background: rgba(255,255,255,.025);
}

.btn-secondary:hover {
    border-color: var(--purple);
    color: white;
    transform: translateY(-3px);
}

.divider {
    width: 70px;
    height: 2px;
    margin: 42px auto 20px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}

.footer {
    color: #59657d;
    font-size: 11px;
    letter-spacing: 2px;
}

.footer span {
    color: #8b5cf6;
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
}

@keyframes shine {
    0% { transform: translateX(-100%); }
    50%, 100% { transform: translateX(100%); }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .error-code { letter-spacing: -7px; }
    .description { font-size: 14px; }
    .btn { width: 100%; }
    .container { padding: 30px 10px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>
<canvas id="particles"></canvas>

<main class="container">

    <div class="badge">
        <span class="status-dot"></span>
        SYSTEM RESPONSE · 404
    </div>

    <div class="error-code" aria-label="Error 404">404</div>

    <h1>Oops! Lost in Space.</h1>

    <p class="description">
        Looks like you've ventured into the unknown.
        The page you're searching for doesn't exist,
        has been moved, or is temporarily unavailable.
    </p>

    <div class="actions">
        <a href="https://NguyenVN.com" class="btn btn-primary"
           target="_blank" rel="noopener noreferrer">
            <span>↗</span> About Me
        </a>
    </div>

</main>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let width, height;
let animationFrame;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    particles = Array.from({
        length: Math.min(Math.floor(width / 12), 90)
    }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + .4,
        speed: Math.random() * .35 + .1,
        alpha: Math.random() * .6 + .15
    }));
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    for (const p of particles) {
        p.y -= p.speed;

        if (p.y < -5) {
            p.y = height + 5;
            p.x = Math.random() * width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,245,255,${p.alpha})`;
        ctx.fill();
    }

    animationFrame = requestAnimationFrame(animate);
}

resize();
animate();

window.addEventListener('resize', resize);

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        cancelAnimationFrame(animationFrame);
    } else {
        cancelAnimationFrame(animationFrame);
        animate();
    }
});
</script>

</body>
</html>
